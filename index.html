<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Price Editor</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1f2328;--mute:#5f6670;--line:#d9d5ca;--acc:#7a3e1d;--acc-ink:#fff;--bad:#a43a2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191a;--card:#202325;--ink:#ecebe6;--mute:#a1a6ab;--line:#383c3f;--acc:#d9a070;--acc-ink:#24150b;--bad:#e58b7c}}
:root[data-theme="dark"]{--bg:#17191a;--card:#202325;--ink:#ecebe6;--mute:#a1a6ab;--line:#383c3f;--acc:#d9a070;--acc-ink:#24150b;--bad:#e58b7c}
html{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid var(--line);background:var(--card)}
.bar h1{font-size:1.15rem;margin:0}
.app{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:1.2rem;padding:1rem;max-width:1200px;margin:0 auto;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.35rem .7rem}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.sm{padding:.15rem .5rem;font-size:.85rem}
button.del{color:var(--bad)}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:.4rem .55rem;width:100%}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{display:block;font-weight:600;font-size:.85rem;margin:.5rem 0 .2rem}
.sec{border:1px solid var(--line);border-radius:10px;padding:.8rem;margin-top:.9rem}
.sech{display:flex;gap:.4rem;align-items:center}.sech input{font-weight:700}
.item{border-top:1px solid var(--line);margin-top:.7rem;padding-top:.6rem}
.row{display:grid;grid-template-columns:1fr 110px;gap:.5rem}
.tools{display:flex;gap:.3rem;margin-top:.4rem;flex-wrap:wrap}
.hint{color:var(--mute);font-size:.85rem;margin:.3rem 0 0}
.paper{background:#fbf6ea;color:#2b1c12;border:1px solid #e0d3b8;border-radius:4px;padding:2.2rem 2rem;font-family:Georgia,"Times New Roman",serif;box-shadow:0 2px 10px #0002;position:sticky;top:1rem}
.paper h2{text-align:center;font-size:2rem;margin:0;letter-spacing:.02em}
.paper .tag{text-align:center;font-style:italic;margin:.2rem 0 1.4rem}
.paper h3{font-size:1.25rem;border-bottom:1.5px solid #2b1c12;padding-bottom:.2rem;margin:1.4rem 0 .6rem}
.paper .m{display:flex;gap:.6rem;align-items:baseline;margin:.55rem 0}
.paper .m b{font-weight:700}.paper .dots{flex:1;border-bottom:1.5px dotted #8a7352;transform:translateY(-.25em);min-width:1rem}
.paper .m p{margin:.1rem 0 0;font-size:.92rem;color:#5b4632}
.paper .em{text-align:center;color:#8a7352}
@media(max-width:820px){.app{grid-template-columns:1fr}.paper{position:static}}
@media print{
  @page{margin:14mm}
  body{background:#fff}.bar,#editor{display:none!important}
  .app{display:block;padding:0;max-width:none}
  .paper{border:0;box-shadow:none;padding:0;position:static;background:#fff}
  .paper .m,.paper h3{break-inside:avoid}.paper h3{break-after:avoid}
}
</style>
</head>
<body>
<div class="bar"><h1>Menu Price Editor</h1><div><button id="reset">Start over</button> <button class="pri" id="print">Print menu</button></div></div>
<div class="app">
  <div class="panel" id="editor">
    <label for="title">Menu title</label><input id="title" data-top="title">
    <label for="tag">Tagline (optional)</label><input id="tag" data-top="tagline">
    <label for="cur">Currency symbol</label><input id="cur" data-top="cur" maxlength="4" style="width:90px">
    <div id="secs"></div>
    <p><button class="pri" data-addsec>Add section</button></p>
    <p class="hint">Changes appear in the preview straight away and are saved in this browser.</p>
  </div>
  <div class="paper" id="paper" aria-label="Menu preview"></div>
</div>
<script>
(() => {
  const KEY = 'menu-price-editor-v1';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sample = () => ({ title: 'Corner Table Café', tagline: 'Fresh coffee and bakes, every morning', cur: '₹', sections: [
    { name: 'Coffee', items: [{ n: 'Flat White', d: 'Two shots, silky steamed milk', p: '220' }, { n: 'Cold Brew', d: 'Steeped for 18 hours', p: '240' }] },
    { name: 'Pastries', items: [{ n: 'Butter Croissant', d: 'Baked fresh every morning', p: '160' }] } ] });
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); if (!S || !Array.isArray(S.sections)) S = sample(); } catch (e) { S = sample(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const price = p => { p = String(p).trim(); if (!p) return ''; const n = Number(p); return S.cur + (isNaN(n) ? esc(p) : n.toLocaleString('en-IN', { maximumFractionDigits: 2 })); };

  function preview() {
    let h = `<h2>${esc(S.title || 'Menu')}</h2>` + (S.tagline ? `<p class="tag">${esc(S.tagline)}</p>` : '<div style="height:1rem"></div>');
    S.sections.forEach(s => {
      h += `<h3>${esc(s.name || 'Untitled section')}</h3>`;
      h += s.items.length ? s.items.map(i => `<div><div class="m"><b>${esc(i.n || 'Untitled item')}</b><span class="dots"></span><span>${price(i.p)}</span></div>${i.d ? `<p>${esc(i.d)}</p>` : ''}</div>`).join('') : '<p class="em">No items in this section yet.</p>';
    });
    if (!S.sections.length) h += '<p class="em">Add a section to start your menu.</p>';
    $('#paper').innerHTML = h;
  }
  function editor() {
    $('#secs').innerHTML = S.sections.map((s, a) => `<div class="sec"><div class="sech"><input aria-label="Section name" data-s="${a}" data-f="name" value="${esc(s.name)}" placeholder="Section name"><button class="sm" data-sup="${a}" aria-label="Move section up">↑</button><button class="sm" data-sdn="${a}" aria-label="Move section down">↓</button><button class="sm del" data-sdel="${a}">Delete</button></div>${s.items.map((i, b) => `<div class="item"><div class="row"><div><label>Item name</label><input data-s="${a}" data-i="${b}" data-f="n" value="${esc(i.n)}"></div><div><label>Price</label><input data-s="${a}" data-i="${b}" data-f="p" value="${esc(i.p)}" inputmode="decimal"></div></div><label>Description (optional)</label><input data-s="${a}" data-i="${b}" data-f="d" value="${esc(i.d)}"><div class="tools"><button class="sm" data-iup="${a},${b}">Move up</button><button class="sm" data-idn="${a},${b}">Move down</button><button class="sm del" data-idel="${a},${b}">Delete item</button></div></div>`).join('')}<p><button class="sm" data-additem="${a}">Add item</button></p></div>`).join('');
    ['title', 'tag', 'cur'].forEach(id => { const el = $('#' + id); el.value = S[el.dataset.top] ?? ''; });
  }
  const all = () => { save(); editor(); preview(); };
  const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return false; [arr[i], arr[j]] = [arr[j], arr[i]]; return true; };

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.top) { S[t.dataset.top] = t.value; if (t.dataset.top === 'cur') S.cur = t.value; }
    else if (t.dataset.f) { const s = S.sections[+t.dataset.s]; if (t.dataset.i !== undefined) s.items[+t.dataset.i][t.dataset.f] = t.value; else s[t.dataset.f] = t.value; }
    else return;
    save(); preview();
  });
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    const ab = v => v.split(',').map(Number);
    if ('addsec' in d) { S.sections.push({ name: 'New section', items: [] }); all(); }
    else if (d.additem) { S.sections[+d.additem].items.push({ n: '', d: '', p: '' }); all(); const l = document.querySelectorAll('.sec')[+d.additem].querySelectorAll('.item'); l[l.length - 1].querySelector('input').focus(); }
    else if (d.sup) { move(S.sections, +d.sup, -1); all(); } else if (d.sdn) { move(S.sections, +d.sdn, 1); all(); }
    else if (d.sdel) { if (confirm('Delete this section and its items?')) { S.sections.splice(+d.sdel, 1); all(); } }
    else if (d.iup) { const [a, i] = ab(d.iup); move(S.sections[a].items, i, -1); all(); }
    else if (d.idn) { const [a, i] = ab(d.idn); move(S.sections[a].items, i, 1); all(); }
    else if (d.idel) { const [a, i] = ab(d.idel); S.sections[a].items.splice(i, 1); all(); }
    else if (b.id === 'print') window.print();
    else if (b.id === 'reset') { if (confirm('Replace your menu with the sample menu?')) { S = sample(); all(); } }
  });
  all();
})();
</script>
</body>
</html>
